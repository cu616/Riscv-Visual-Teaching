<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHarmony ArkWeb Smoke</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: sans-serif;
        background: #f7fafc;
        color: #172033;
      }

      main {
        box-sizing: border-box;
        min-height: 100%;
        padding: 32px;
        display: grid;
        place-items: center;
      }

      section {
        width: min(720px, 100%);
        padding: 24px;
        border: 1px solid #d6deea;
        border-radius: 8px;
        background: white;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 8px 0;
        line-height: 1.6;
      }

      button {
        margin-top: 16px;
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>ArkWeb smoke page</h1>
        <p>如果这个页面能稳定显示 60 秒，说明 Web 组件本身能启动。</p>
        <p id="status">JavaScript 尚未执行</p>
        <button id="button">测试点击</button>
      </section>
    </main>
    <script>
      const status = document.querySelector('#status');
      document.querySelector('#button').addEventListener('click', () => {
        status.textContent = `点击正常：${new Date().toLocaleTimeString()}`;
      });
      status.textContent = `JavaScript 已执行：${new Date().toLocaleTimeString()}`;
    </script>
  </body>
</html>
